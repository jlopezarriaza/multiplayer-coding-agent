<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGY Paint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <button id="pencil" class="tool-button active">Pencil</button>
            <button id="eraser" class="tool-button">Eraser</button>
            <button id="line" class="tool-button">Line</button>
            <input type="color" id="colorPicker" value="#000000">
            <button id="clearCanvas" class="tool-button">Clear</button>
            <input type="range" id="brushSize" min="1" max="50" value="5">
        </div>
        <canvas id="paintCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
