<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Paint</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="tool-group">
                <button id="tool-pencil" class="tool-button active" data-tool="pencil">Pencil</button>
                <button id="tool-eraser" class="tool-button" data-tool="eraser">Eraser</button>
                <button id="tool-line" class="tool-button" data-tool="line">Line</button>
                <button id="tool-rectangle" class="tool-button" data-tool="rectangle">Rectangle</button>
                <button id="tool-circle" class="tool-button" data-tool="circle">Circle</button>
                <button id="tool-fill" class="tool-button" data-tool="fill">Fill</button>
                <button id="tool-text" class="tool-button" data-tool="text">Text</button>
            </div>
            <div class="tool-group">
                <label for="brush-size">Size:</label>
                <input type="range" id="brush-size" min="1" max="50" value="5">
            </div>
            <div class="tool-group">
                <input type="color" id="color-picker" value="#000000">
                <div class="color-swatch-group">
                    <div class="color-swatch black active" data-color="#000000"></div>
                    <div class="color-swatch white" data-color="#ffffff"></div>
                    <div class="color-swatch red" data-color="#ff0000"></div>
                    <div class="color-swatch green" data-color="#00ff00"></div>
                    <div class="color-swatch blue" data-color="#0000ff"></div>
                    <div class="color-swatch yellow" data-color="#ffff00"></div>
                </div>
            </div>
            <div class="tool-group">
                <button id="fill-shape" class="tool-button">Outline/Fill</button>
            </div>
            <div class="tool-group">
                <button id="undo" class="tool-button">Undo</button>
                <button id="redo" class="tool-button">Redo</button>
            </div>
            <div class="tool-group">
                <button id="new-canvas" class="tool-button">New</button>
                <button id="save-image" class="tool-button">Save</button>
            </div>
        </div>
        <canvas id="paint-canvas" width="800" height="600"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

                <button id="tool-text" class="tool-button" data-tool="text">Text</button>
            </div>
            <div class="tool-group">
                <label for="brush-size">Size:</label>
                <input type="range" id="brush-size" min="1" max="20" value="5">
            </div>
            <div class="tool-group">
                <button id="button-new" class="action-button">New</button>
                <button id="button-save" class="action-button">Save</button>
                <button id="button-undo" class="action-button">Undo</button>
                <button id="button-redo" class="action-button">Redo</button>
            </div>
        </div>

        <div class="color-palette">
            <div class="color-swatch" style="background-color: black;" data-color="black"></div>
            <div class="color-swatch" style="background-color: white;" data-color="white"></div>
            <div class="color-swatch" style="background-color: red;" data-color="red"></div>
            <div class="color-swatch" style="background-color: green;" data-color="green"></div>
            <div class="color-swatch" style="background-color: blue;" data-color="blue"></div>
            <div class="color-swatch" style="background-color: yellow;" data-color="yellow"></div>
            <div class="color-swatch" style="background-color: orange;" data-color="orange"></div>
            <div class="color-swatch" style="background-color: purple;" data-color="purple"></div>
            <input type="color" id="custom-color" value="#000000">
        </div>

        <canvas id="paint-canvas" width="800" height="600"></canvas>

        <div class="status-bar">
            <span>Status: Ready</span>
        </div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
